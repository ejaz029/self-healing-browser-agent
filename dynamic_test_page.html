
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Browser Test</title>
</head>
<body>
    <h1>Order Dashboard</h1>

    <p id="status">Order status: Pending</p>

    <button id="confirm-order" onclick="
        document.getElementById('status').textContent =
        'Order status: Confirmed';
    ">
        Confirm Order
    </button>

    <script>
        // Simulate a website dynamically changing its selector.
        setTimeout(() => {
            const button = document.querySelector("button");
            button.id = "confirm-order-updated";
        }, 300);
    </script>
</body>
</html>
