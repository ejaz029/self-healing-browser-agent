<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Label Test</title>
</head>
<body>
    <h1>Order Dashboard</h1>

    <p id="status">Order status: Pending</p>

    <button
        id="confirm-order-updated"
        aria-label="Confirm Order"
        onclick="
            document.getElementById('status').textContent =
            'Order status: Confirmed';
        "
    >
        Place Order
    </button>
</body>
</html>
